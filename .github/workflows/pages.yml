name: Publish FastFacts365 website and privacy policy
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'privacy.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fastfacts-website-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check pages files
        run: |
          test -s index.html
          test -s privacy.html
      - name: Configure or enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish to public GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
